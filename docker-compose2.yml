services:
  camel-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: camel
      POSTGRES_USER: camel_user
      POSTGRES_PASSWORD: camel_pass
    ports:
      - "5432:5432"
    volumes:
      - camel-db-data:/var/lib/postgresql/data

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"

  console:
    network_mode: host
    environment:
      - KAFKA_BROKERS=localhost:9092
    image: docker.redpanda.com/redpandadata/console:latest

volumes:
  camel-db-data:
